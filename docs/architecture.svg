<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="2" dy="3" stdDeviation="3.5" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fffbeb"/>
    <stop offset="100%" stop-color="#fef3c7"/>
  </linearGradient>
    <linearGradient id="violetGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f5f3ff"/>
    <stop offset="100%" stop-color="#ede9fe"/>
  </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#eff6ff"/>
    <stop offset="100%" stop-color="#dbeafe"/>
  </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f0fdf4"/>
    <stop offset="100%" stop-color="#dcfce7"/>
  </linearGradient>
    <marker id="arrow" markerWidth="11" markerHeight="8" refX="9.5" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="8" refX="9.5" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="620" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="40" y="48" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Super Duper — Architecture</text>
  <text x="40" y="70" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748b">Layered Cargo workspace: the core engine is consumed by the CLI directly, or via the optional FFI + UI path.</text>

  
  <g filter="url(#shadow)">
    <rect x="150" y="90" width="420" height="110" rx="12"
      fill="url(#amberGrad)" stroke="#d97706" stroke-width="2"
      stroke-dasharray="7 4"/>
  </g>
  <text x="360" y="132" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    font-size="19" font-weight="700" fill="#0f172a">WinUI 3  (C# / .NET 10)</text>
  <text x="360" y="160" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    font-size="13" fill="#334155">P/Invoke via EngineWrapper.cs</text>
  <text x="360" y="183" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    font-size="11.5" font-weight="600" fill="#d97706" letter-spacing="0.3">experimental · optional</text>
  
  <line x1="360" y1="200" x2="360" y2="268" stroke="#64748b"
    stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="376" y="239" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    font-size="12" fill="#475569" font-style="italic">C ABI  (u64 handles)</text>
  
  <g filter="url(#shadow)">
    <rect x="150" y="270" width="420" height="110" rx="12"
      fill="url(#violetGrad)" stroke="#7c3aed" stroke-width="2"
      stroke-dasharray="7 4"/>
  </g>
  <text x="360" y="312" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    font-size="19" font-weight="700" fill="#0f172a">super-duper-ffi  (cdylib)</text>
  <text x="360" y="340" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    font-size="13" fill="#334155">Handle table · Callbacks</text>
  <text x="360" y="363" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    font-size="11.5" font-weight="600" fill="#7c3aed" letter-spacing="0.3">optional FFI boundary</text>
  
  <line x1="360" y1="380" x2="360" y2="448" stroke="#64748b"
    stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="376" y="419" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    font-size="12" fill="#475569" font-style="italic">Rust function calls</text>
  
  <g filter="url(#shadow)">
    <rect x="150" y="450" width="420" height="110" rx="12"
      fill="url(#blueGrad)" stroke="#2563eb" stroke-width="2"
      />
  </g>
  <text x="360" y="492" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    font-size="19" font-weight="700" fill="#0f172a">super-duper-core  (rlib)</text>
  <text x="360" y="520" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    font-size="13" fill="#334155">Scanner · Hasher · Engine  ·  SQLite · RocksDB · Analysis</text>
  <text x="360" y="543" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    font-size="11.5" font-weight="600" fill="#2563eb" letter-spacing="0.3">the engine — all business logic</text>

  
  <line x1="640" y1="505" x2="573" y2="505"
    stroke="#16a34a" stroke-width="2.6" marker-end="url(#arrowGreen)"/>
  <text x="632" y="493" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    font-size="11" fill="#15803d" font-style="italic">links core crate directly</text>
  
  <g filter="url(#shadow)">
    <rect x="640" y="466" width="150" height="78" rx="12"
      fill="url(#greenGrad)" stroke="#16a34a" stroke-width="2"/>
  </g>
  <text x="715" y="499" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    font-size="16" font-weight="700" fill="#0f172a">super-duper-cli</text>
  <text x="715" y="521" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
    font-size="11.5" font-weight="600" fill="#16a34a">primary entry point</text>

  <!-- legend -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">
    <rect x="40" y="568" width="13" height="13" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="60" y="579">Functional / actively developed</text>
    <rect x="270" y="568" width="13" height="13" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="290" y="579">Experimental / optional</text>
    <rect x="490" y="568" width="13" height="13" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="510" y="579">Headless CLI driver</text>
  </g>
</svg>
