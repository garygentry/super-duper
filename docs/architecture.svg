<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="2" dy="3" stdDeviation="3.5" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <marker id="arrow" markerWidth="11" markerHeight="8" refX="9.5" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="480" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="40" y="48" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Super Duper Architecture</text>
  <text x="40" y="72" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Rust core first: the CLI links directly, and the FFI is a reusable boundary for future native clients.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="140" width="240" height="110" rx="10" fill="url(#greenGrad)" stroke="#16a34a" stroke-width="2"/>
  </g>
  <text x="210" y="181" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">super-duper-cli</text>
  <text x="210" y="210" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Headless command driver</text>
  <text x="210" y="233" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#16a34a">actively developed</text>

  <g filter="url(#shadow)">
    <rect x="350" y="140" width="240" height="110" rx="10" fill="url(#blueGrad)" stroke="#2563eb" stroke-width="2"/>
  </g>
  <text x="470" y="181" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">super-duper-core</text>
  <text x="470" y="210" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Scan, hash, analyze, store</text>
  <text x="470" y="233" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2563eb">business logic</text>

  <g filter="url(#shadow)">
    <rect x="610" y="140" width="240" height="110" rx="10" fill="url(#violetGrad)" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 4"/>
  </g>
  <text x="730" y="181" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">super-duper-ffi</text>
  <text x="730" y="210" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">C ABI for native clients</text>
  <text x="730" y="233" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#7c3aed">UI-agnostic</text>

  <line x1="330" y1="195" x2="347" y2="195" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="610" y1="195" x2="593" y2="195" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#334155">
    <text x="90" y="324">Core dependencies</text>
    <text x="90" y="350">SQLite session store</text>
    <text x="90" y="374">RocksDB hash cache</text>
    <text x="90" y="398">Rayon traversal and hashing</text>
    <text x="350" y="324">Primary workflows</text>
    <text x="350" y="350">Detect duplicate files</text>
    <text x="350" y="374">Analyze directory similarity</text>
    <text x="350" y="398">Stage reviewed deletion plans</text>
    <text x="610" y="324">Future clients</text>
    <text x="610" y="350">New Windows app</text>
    <text x="610" y="374">Other native shells</text>
    <text x="610" y="398">Automation hosts</text>
  </g>
</svg>
