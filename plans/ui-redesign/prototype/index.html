<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Super Duper — UI redesign concept</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="demo-bar" aria-label="Design review controls">
    <strong>Design concept · fictional data</strong>
    <label for="scenario">Scenario</label>
    <select id="scenario">
      <option value="completed">Completed scan</option>
      <option value="running">New scan running</option>
      <option value="cancelled">Cancelled scan</option>
      <option value="empty">No filter matches</option>
      <option value="changed">Changed copy</option>
      <option value="first">First use</option>
    </select>
    <button id="reset-demo">Reset demo</button>
  </div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">SD</span> Super Duper</div>
      <p class="eyebrow">SAVED SCANS</p>
      <button class="saved selected" data-action="saved"><strong>Photo archive</strong><span>2 locations · last scan today</span></button>
      <button class="new-scan" data-action="new">+ New saved scan</button>
      <p class="sidebar-note">Find exact duplicates.<br>Choose the copies to keep.</p>
    </aside>
    <div class="workspace">
      <header class="context"><div><p class="eyebrow">SAVED SCAN</p><h1 id="context-name">Photo archive</h1><p id="run-context"></p></div><button data-action="setup">Edit locations</button></header>
      <div id="active-run"></div>
      <nav class="primary-nav" aria-label="Workspace">
        <button data-page="scan">Scan</button><button data-page="results">Results</button><button data-page="review">Review <span id="review-badge">0</span></button><button data-page="history">History</button>
      </nav>
      <main id="content" tabindex="-1"></main>
      <footer><span id="footer-context"></span><span>Review and validation available · file removal unavailable</span></footer>
    </div>
  </div>
  <dialog id="detail-dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog">Close</button></div><div id="dialog-body"></div></dialog>
  <div class="sr-only" id="announcement" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
