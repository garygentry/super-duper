[package]
name = "super-duper-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Configuration
config = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Evidence snapshot hashing (examples/)
sha2 = "0.10"

# File system
glob = "0.3"

# Parallelism
rayon = "1.9"
dashmap = "6"

# Hashing
twox-hash = "2"

# Cache
rocksdb = "0.25"
bincode = { version = "2", features = ["serde"] }

# Database (SQLite)
rusqlite = { version = "0.40", features = ["bundled", "collation"] }

# Logging
tracing = "0.1"

# Error handling
thiserror = "2"

# Collections
ahash = "0.8.11"

# Time
chrono = "0.4.37"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
trash = "5"
winapi = { version = "0.3", features = [
    "fileapi",
    "handleapi",
    "winnt",
    "minwindef",
    "winerror",
    "winbase",
    "processthreadsapi",
    "psapi",
    "sysinfoapi",
    "ioapiset",
    "winioctl",
] }
