[package]
name = "super-duper-worker"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[dependencies]
super-duper-core = { path = "../super-duper-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glob = "0.3"
rusqlite = "0.40"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
