# Build and test gate for the Rust workspace and the Windows app.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # The WPF app targets Windows 11 and the smoke suite needs an interactive
    # desktop, so this job covers everything except that UI automation.
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version

      - name: Install the .NET SDK pinned by global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Point bindgen at the runner's LLVM
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          # A Cargo.lock change (a new dependency, a version bump) starts from the newest earlier
          # build instead of from scratch; cargo rebuilds only what changed.
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets

      - name: Test the Rust workspace
        run: cargo test --workspace

      - name: Build the Rust workspace
        # clippy and cargo test do not produce super-duper-worker.exe; without it the
        # worker-backed Infrastructure tests report Inconclusive and the job still passes.
        run: cargo build --workspace

      - name: Build the Windows solution
        # Rust first: the WPF project copies the matching worker beside the app.
        run: dotnet build apps/windows/SuperDuper.Windows.sln

      - name: Test the Windows solution
        # -m:1 keeps the STA surface suite from starving the Infrastructure host.
        # The WPF smoke journey needs a real desktop and is excluded here.
        run: dotnet test apps/windows/SuperDuper.Windows.sln --no-build -m:1

  release-package:
    # Everything Verify-WindowsRelease.ps1 checks except the WPF smoke, which needs a connected
    # desktop and stays on the VM (docs/release-checklist.md): Release Rust and .NET tests,
    # self-contained publish, version agreement, third-party notices, the worker smoke against
    # the published app, and the zip.
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustc --version

      - name: Install the .NET SDK pinned by global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Point bindgen at the runner's LLVM
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Cache cargo registry and Release build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: Cache cargo-about
        id: cargo-about
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-about.exe
          key: cargo-about-0.9.2-${{ runner.os }}

      - name: Install cargo-about
        if: steps.cargo-about.outputs.cache-hit != 'true'
        run: cargo install cargo-about --locked --features cli --version 0.9.2

      - name: Verify the Release build and package
        run: ./scripts/Verify-WindowsRelease.ps1 -SkipWpfSmoke

      - name: Keep the package from master builds
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-package
          path: |
            artifacts/super-duper-*-win-x64.zip
            artifacts/super-duper-*-win-x64.zip.sha256
          retention-days: 14
          if-no-files-found: error
